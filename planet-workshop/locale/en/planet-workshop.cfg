start-missing=The hand-made start area uses __1__, which doesn't exist in this game (it will be left out).
start-needs=As a starting planet it needs __1__: a new game can't get going or reach space without it.
start-needs-oil=As a starting planet it needs __1__: plastic for rockets is made from oil, so players couldn't reach space.
start-needs-water=As a starting planet it needs water: steam power and oil processing need it, and a new game has no other way to get it.
start-not-near=__1__ isn't near the landing spot. A new game starts with almost nothing, so it should be close (Resources > Near the start).
