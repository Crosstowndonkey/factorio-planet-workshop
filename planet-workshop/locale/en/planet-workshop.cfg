[mod-name]
planet-workshop=Planet Workshop

[mod-description]
planet-workshop=Design your own Space Age planets - terrain, ores, enemies, physics, science pack, recipes and research - and share them as planet codes.

[mod-setting-name]
planet-workshop-planets=Planet codes

[mod-setting-description]
planet-workshop-planets=Paste planet codes here (they start with PW1:). You can paste several, one after another with a space between them. Each planet appears in Space Age after the game restarts.

